<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício 01 - Media Queries</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Layout Responsivo</h1>
    </header>

    <main class="container">

        <section class="card">
            <h2>Desktop</h2>
            <p>
                Em telas grandes o conteúdo ocupa três colunas.
            </p>
        </section>

        <section class="card">
            <h2>Tablet</h2>
            <p>
                Em telas médias o conteúdo é reorganizado.
            </p>
        </section>

        <section class="card">
            <h2>Celular</h2>
            <p>
                Em telas pequenas os elementos ficam em uma coluna.
            </p>
        </section>

    </main>

</body>
</html>
